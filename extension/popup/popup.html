<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astra</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="flat-card">
    <header class="app-header">
      <div class="brand">
        <div class="shield-icon">🛡️</div>
        <div>
          <h1>Astra</h1>
          <span class="badge">SIH26171</span>
        </div>
      </div>
      <div id="statusDot" class="status-dot idle"></div>
    </header>

    <main class="main-content">
      <div class="status-banner">
        <span class="label">Status:</span>
        <span id="statusText" class="value">Idle</span>
      </div>

      <div class="input-group">
        <label for="goalInput">Agent Goal Prompt</label>
        <textarea id="goalInput" placeholder="e.g., Fill out registration form and click submit" rows="2"></textarea>
      </div>

      <div class="control-actions">
        <div class="btn-row">
          <button id="btnStart" class="btn btn-primary">
            <span>▶ Run Astra</span>
          </button>
          <button id="btnStop" class="btn btn-danger" disabled>
            <span>⏹ Stop</span>
          </button>
        </div>

        <button id="btnProof" class="btn btn-proof">
          <span>📷 View Redacted Proof Image</span>
        </button>
      </div>

      <details class="settings-accordion">
        <summary>⚙️ Redaction Settings & Audit</summary>
        <div class="accordion-content">
          <label class="toggle-row">
            <span>Tier 1: Deterministic DOM</span>
            <input type="checkbox" id="chkDom" checked>
          </label>
          <label class="toggle-row">
            <span>Tier 2: Text & Luhn NLP</span>
            <input type="checkbox" id="chkText" checked>
          </label>
          <label class="toggle-row">
            <span>Tier 3: Visual CV Redactor</span>
            <input type="checkbox" id="chkCv" checked>
          </label>
          <div class="input-row">
            <span>Server Endpoint:</span>
            <input type="text" id="serverUrl" value="http://127.0.0.1:8000">
          </div>
        </div>
      </details>

      <section class="logs-section">
        <h3>Live Action Event Logs</h3>
        <div id="logsContainer" class="logs-container">
          <div class="log-entry system">System initialized. Ready.</div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <span>3-Tier Local Redaction (+5px buffer) • Audit Log Active</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
